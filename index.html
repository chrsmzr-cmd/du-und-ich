<style>
/* Layout: full-bleed vector map; Apple-Maps-style frosted bottom sheet on phones, floating side panel on wide screens. */
:root{
  --water:#A7D1EF; --land:#F4F1EA; --border:rgba(118,104,140,.42); --coast:rgba(70,120,170,.35);
  --label:#4B4B57; --halo:rgba(244,241,234,.92);
  --sheet:rgba(249,249,251,.84); --sheet-solid:#F9F9FB; --fg:#1C1C1E; --muted:#6D6D78;
  --hair:rgba(60,60,67,.16); --fill:rgba(118,118,128,.12); --fill-strong:rgba(118,118,128,.2);
  --chris:#0A84FF; --juana:#FF375F; --accent:#0A84FF; --danger:#D70015;
  --shadow:0 10px 40px rgba(20,30,50,.18),0 1px 3px rgba(20,30,50,.12);
  --font:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --water:#15202C; --land:#2A2C31; --border:rgba(190,185,210,.26); --coast:rgba(120,160,200,.25);
  --label:#C6C8D0; --halo:rgba(30,32,36,.88);
  --sheet:rgba(28,28,32,.82); --sheet-solid:#1C1C20; --fg:#F2F2F7; --muted:#9C9CA6;
  --hair:rgba(235,235,245,.13); --fill:rgba(118,118,128,.24); --fill-strong:rgba(118,118,128,.34);
  --chris:#409CFF; --juana:#FF6482; --accent:#409CFF; --danger:#FF6961;
  --shadow:0 10px 40px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --water:#15202C; --land:#2A2C31; --border:rgba(190,185,210,.26); --coast:rgba(120,160,200,.25);
  --label:#C6C8D0; --halo:rgba(30,32,36,.88);
  --sheet:rgba(28,28,32,.82); --sheet-solid:#1C1C20; --fg:#F2F2F7; --muted:#9C9CA6;
  --hair:rgba(235,235,245,.13); --fill:rgba(118,118,128,.24); --fill-strong:rgba(118,118,128,.34);
  --chris:#409CFF; --juana:#FF6482; --accent:#409CFF; --danger:#FF6961;
  --shadow:0 10px 40px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0}
html,body{height:100%}
body{background:var(--water);color:var(--fg);font:15px/1.35 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

#map{position:fixed;inset:0;width:100%;height:100%;background:var(--water)}
#maperr{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);max-width:calc(100% - 32px);padding:10px 14px;border-radius:12px;background:var(--sheet-solid);box-shadow:var(--shadow);font-size:13px;text-align:center}
.maplibregl-ctrl-bottom-right{bottom:calc(var(--peek,220px) + 4px)}
@media (min-width:760px){.maplibregl-ctrl-bottom-right{bottom:0}}
.maplibregl-ctrl-attrib{font-size:10px}
.maplibregl-marker{will-change:transform}
/* While the map moves, drop the frosted blur: blurring over a live map costs a lot on phones */
body.moving #sheet,body.moving .mapbtns,body.moving .brand,body.moving #pickbar{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--sheet-solid)}

/* Pins */
.pin{width:0;height:0}
.pin .dot{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pin .bubble{position:absolute;cursor:pointer;left:-26px;bottom:10px;width:52px;height:52px;border-radius:50%;padding:3px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25);pointer-events:auto;border:0}
.pin .bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.pin .ava{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;color:#fff;font:700 21px/1 var(--font-round);background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 70%)}
.pin .tag{position:absolute;top:9px;left:0;transform:translateX(-50%);white-space:nowrap;text-align:center;padding:3px 9px 4px;border-radius:999px;background:var(--sheet-solid);box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:12px;line-height:1.15}
.pin .tag b{display:block;font-weight:650}
.pin .tag span{color:var(--muted);font-size:11px}
.pin.me .bubble{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#mid{width:0;height:0;pointer-events:none}
#mid .pill{transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--sheet-solid);box-shadow:0 3px 10px rgba(0,0,0,.2);font:650 13px/1 var(--font-round);font-variant-numeric:tabular-nums;white-space:nowrap}
#mid svg{width:12px;height:12px;fill:var(--juana)}

/* Crosshair for picking */
#cross{position:fixed;left:0;top:0;pointer-events:none}
#cross .p{position:absolute;left:-17px;top:-44px;width:34px;height:44px}
#cross .shadow{position:absolute;left:-6px;top:-3px;width:12px;height:6px;border-radius:50%;background:rgba(0,0,0,.25)}

/* Map buttons */
.mapbtns{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;border-radius:12px;background:var(--sheet);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);box-shadow:var(--shadow);overflow:hidden}
.mapbtns button{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--accent)}
.mapbtns button+button{border-top:1px solid var(--hair)}
.mapbtns svg{width:20px;height:20px}
.mapbtns button.busy svg{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
code{font-size:12px;padding:1px 4px;border-radius:4px;background:var(--fill)}
.brand{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;align-items:center;gap:6px;padding:7px 12px 7px 8px;border-radius:999px;background:var(--sheet);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);box-shadow:var(--shadow);font:650 13px/1 var(--font-round)}
.brand .m{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;color:#fff;font:700 11px/1 var(--font-round)}
.brand .m.c{background:var(--chris)} .brand .m.j{background:var(--juana);margin-left:-10px;box-shadow:0 0 0 2px var(--sheet-solid)}

/* Sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;height:min(84%,720px);display:flex;flex-direction:column;background:var(--sheet);backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);border-radius:14px 14px 0 0;box-shadow:var(--shadow);transform:translateY(calc(100% - var(--peek,220px)));transition:transform .38s cubic-bezier(.2,.9,.25,1)}
#sheet.full{transform:translateY(0)}
#sheet.hide{transform:translateY(105%)}
#sheet.drag{transition:none}
.head{padding:6px 16px 10px;touch-action:none;flex:none}
.grab{display:block;margin:0 auto 8px;width:38px;height:5px;border-radius:3px;background:var(--fill-strong);border:0;padding:0}
.searchrow{display:flex;gap:10px;align-items:center}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:38px;padding:0 10px;border-radius:10px;background:var(--fill)}
.search svg{width:17px;height:17px;flex:none;fill:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px}
.search input::placeholder{color:var(--muted)}
.meava{flex:none;width:36px;height:36px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;font:700 15px/1 var(--font-round);background:var(--fill-strong)}
.body{flex:1;min-height:0;overflow-y:auto;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 24px);overscroll-behavior:contain}

.summary{display:flex;gap:12px;align-items:stretch;padding:4px 0 14px}
.stat{flex:1;min-width:0;padding:12px 14px;border-radius:14px;background:var(--sheet-solid);border:1px solid var(--hair)}
.stat .k{font-size:12px;color:var(--muted);font-weight:550}
.stat .v{font:700 26px/1.1 var(--font-round);font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-size:15px;font-weight:650;color:var(--muted)}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.when .v{color:var(--juana)}

h2{font:700 20px/1.2 var(--font);letter-spacing:-.01em;margin:18px 0 8px;text-wrap:balance}
.group{border-radius:12px;background:var(--sheet-solid);border:1px solid var(--hair);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:48px}
.row+.row{border-top:1px solid var(--hair)}
.row .ava{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 16px/1 var(--font-round)}
.row .txt{flex:1;min-width:0}
.row .t,.row .d{display:block}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--fill)}
.row .ic svg{width:16px;height:16px;fill:var(--accent)}
.row .val{flex:none;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 12px}
.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--fill);color:var(--accent);font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.note{font-size:12px;color:var(--muted);margin:6px 4px 0}

.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 14px 4px}
.count div{text-align:center;padding:10px 0 8px;border-radius:10px;background:var(--fill)}
.count b{display:block;font:700 26px/1 var(--font-round);font-variant-numeric:tabular-nums}
.count span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.plantitle{padding:12px 14px 0;font-weight:650}
.plansub{padding:2px 14px 12px;font-size:13px;color:var(--muted)}
.form{display:grid;gap:10px;padding:12px 14px 14px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:550}
.form input{height:40px;border-radius:10px;border:1px solid var(--hair);background:var(--fill);padding:0 10px;font-size:16px;min-width:0;width:100%}

.who{padding:16px 14px}
.who p{margin:0 0 12px;color:var(--muted);font-size:14px}
.who .pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who button{border:1px solid var(--hair);background:var(--sheet-solid);border-radius:14px;padding:14px 8px;display:grid;justify-items:center;gap:8px;font-weight:650}
.who button .ava{width:46px;height:46px;font-size:20px}

.results .row{cursor:pointer;width:100%;border:0;background:transparent;text-align:left}
.results .row:hover{background:var(--fill)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;font-size:12px;color:var(--muted)}
.foot button{border:0;background:none;color:var(--accent);font-size:12px;font-weight:600;padding:4px 0}
.status{display:inline-flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:#34C759}
.status.off i{background:#FF9F0A}

/* Pick bar */
#pickbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:14px;border-radius:16px;background:var(--sheet);backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);box-shadow:var(--shadow);display:grid;gap:10px}
#pickbar .t{font-weight:650}
#pickbar .d{font-size:13px;color:var(--muted)}
#pickbar .acts{display:flex;gap:8px}
#pickbar .acts .btn{flex:1;padding:12px}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);padding:9px 14px;border-radius:999px;background:var(--sheet-solid);box-shadow:var(--shadow);font-size:13px;font-weight:600;white-space:nowrap;transition:opacity .25s}

@media (min-width:760px){
  #sheet{left:16px;right:auto;top:calc(env(safe-area-inset-top,0px) + 16px);bottom:auto;width:380px;height:auto;max-height:calc(100% - 32px);border-radius:16px;transform:none!important;transition:none}
  #sheet.hide{display:none}
  .grab{display:none}
  .head{padding-top:14px}
  .brand{display:none}
  #pickbar{left:auto;right:16px;width:360px}
}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}.pin.me .bubble{animation:none}}
</style>

</head>
<body>
<div id="map" aria-label="Karte mit euren Standorten"></div>
<div id="maperr" hidden>Die Karte lädt gerade nicht. Prüf deine Internetverbindung.</div>

  <div id="mid" hidden><div class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.1 1.8-1.9 3.3-3.1 5.4-3.1 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg><span id="midtxt"></span></div></div>
  <div class="pin" id="pin-chris" hidden style="--c:var(--chris)"><span class="dot"></span><button class="bubble" data-who="chris" aria-label="Chris auf der Karte zeigen"><span class="ava">C</span></button><div class="tag"><b>Chris</b><span></span></div></div>
  <div class="pin" id="pin-juana" hidden style="--c:var(--juana)"><span class="dot"></span><button class="bubble" data-who="juana" aria-label="Juana auf der Karte zeigen"><span class="ava">J</span></button><div class="tag"><b>Juana</b><span></span></div></div>
</div>
<div id="cross" hidden><span class="shadow"></span><svg class="p" viewBox="0 0 34 44" aria-hidden="true"><path id="crossfill" d="M17 43s14-14.6 14-25.5A14 14 0 0 0 3 17.5C3 28.4 17 43 17 43z" fill="#0A84FF" stroke="#fff" stroke-width="2.5"/><circle cx="17" cy="17.5" r="5" fill="#fff"/></svg></div>

<div class="brand" aria-hidden="true"><span class="m c">C</span><span class="m j">J</span>Chris &amp; Juana</div>
<div class="mapbtns">
  <button id="btn-fit" aria-label="Beide zeigen" title="Beide zeigen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><circle cx="9" cy="12" r="1.6" fill="currentColor"/><circle cx="15" cy="12" r="1.6" fill="currentColor"/></svg></button>
  <button id="btn-gps" aria-label="Meinen GPS-Standort senden" title="GPS-Standort senden"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.4 2.6a.9.9 0 0 0-1-.2L3.1 9.6a.9.9 0 0 0 .1 1.7l7.2 2.3 2.3 7.2a.9.9 0 0 0 1.7.1l7.2-17.3a.9.9 0 0 0-.2-1z"/></svg></button>
  <button id="btn-pick" aria-label="Meinen Standort auf der Karte setzen" title="Standort auf der Karte setzen"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7zm0 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg></button>
</div>

<section id="sheet" aria-label="Übersicht">
  <div class="head" id="sheethead">
    <button class="grab" id="grab" aria-label="Übersicht auf- oder zuklappen"></button>
    <div class="searchrow">
      <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l4.6 4.6-1.4 1.4-4.6-4.6A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg><input id="q" type="search" placeholder="Wo bist du gerade?" autocomplete="off" enterkeyhint="search" aria-label="Ort suchen"></label>
      <button class="meava" id="meava" aria-label="Wer bist du?">?</button>
    </div>
  </div>
  <div class="body" id="body"></div>
</section>

<div id="pickbar" hidden>
  <div><div class="t">Schieb die Karte unter die Nadel</div><div class="d" id="pickplace">…</div></div>
  <div class="acts"><button class="btn" id="pick-cancel">Abbrechen</button><button class="btn primary" id="pick-ok">Hier bin ich</button></div>
</div>
<div id="toast" hidden></div>

/* ---------- cities ---------- */
const CITIES = CITY_RAW.split('\n').map(l => { const p = l.split('|'); return {n:p[0], lat:+p[1], lng:+p[2], cc:p[3]}; });
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').toLowerCase();
CITIES.forEach(c => c.k = norm(c.n));
function nearestCity(lng, lat){
  let best=null, bd=Infinity;
  for (const c of CITIES){ const d = geoDistance([lng,lat],[c.lng,c.lat]); if (d<bd){bd=d;best=c;} }
  return {city:best, km: bd*6371};
}
function searchCities(q){
  const k = norm(q.trim()); if (!k) return [];
  const pre=[], inc=[];
  for (const c of CITIES){ if (c.k.startsWith(k)) pre.push(c); else if (inc.length<20 && c.k.includes(k)) inc.push(c); if (pre.length>=10) break; }

}

  return 2*Math.asin(Math.min(1, Math.sqrt(h)));
}
function geoInterpolate(a, b){
  const d = geoDistance(a,b);
  const toV = p => [Math.cos(p[1]*RAD)*Math.cos(p[0]*RAD), Math.cos(p[1]*RAD)*Math.sin(p[0]*RAD), Math.sin(p[1]*RAD)];
  const A = toV(a), B = toV(b);
  return t => {
    if (d < 1e-9) return a.slice();
    const k1 = Math.sin((1-t)*d)/Math.sin(d), k2 = Math.sin(t*d)/Math.sin(d);
    const x=k1*A[0]+k2*B[0], y=k1*A[1]+k2*B[1], z=k1*A[2]+k2*B[2];
    return [Math.atan2(y,x)/RAD, Math.atan2(z, Math.hypot(x,y))/RAD];
  };
}
function arcCoords(a, b, n=128){
  const ip = geoInterpolate([a.lng,a.lat],[b.lng,b.lat]); const out=[];
  for (let i=0;i<=n;i++){
    const p = ip(i/n);
    if (out.length){ const prev = out[out.length-1][0]; while (p[0]-prev > 180) p[0]-=360; while (p[0]-prev < -180) p[0]+=360; }
    out.push(p);
  }
  return out;
}

function setP(id, prop, val){ try { map.setPaintProperty(id, prop, val); } catch(e){} }
function applyPalette(){
  if (!map || !styleReady) return;
  const P = isDark() ? PAL.dark : PAL.light;
  if (USE_MT) mtStyleDark = isDark();
  for (const L of map.getStyle().layers){
    const id = L.id, sl = L['source-layer'] || '', t = L.type;
    try {
      if (t === 'fill-extrusion'){ map.setLayoutProperty(id,'visibility','none'); continue; }
      if (USE_MT){
        if (t === 'symbol'){ const tf = map.getLayoutProperty(id,'text-field'); if (tf && /name/.test(JSON.stringify(tf)) && !/housenumber/.test(sl)) map.setLayoutProperty(id,'text-field', NAME_DE); }
        continue;
      }
      if (t === 'background'){ setP(id,'background-color',P.land); continue; }
      if (t === 'raster' || t === 'hillshade'){ map.setLayoutProperty(id,'visibility','none'); continue; }
      if (sl === 'water' && t === 'fill'){ setP(id,'fill-color',P.water); setP(id,'fill-outline-color',P.water); continue; }
      if (sl === 'waterway' && t === 'line'){ setP(id,'line-color',P.waterLine); continue; }
      if ((sl === 'landcover' || sl === 'park' || sl === 'landuse') && t === 'fill'){
        const c = /wood|forest/.test(id) ? P.wood : /ice|glacier/.test(id) ? P.ice : /sand|beach/.test(id) ? P.sand
                : /park|grass|cemetery|pitch|golf|meadow|scrub|landcover/.test(id) ? P.park : P.land2;
        setP(id,'fill-color',c); setP(id,'fill-outline-color',c); continue;
      }
      if (sl === 'park' && t === 'line'){ map.setLayoutProperty(id,'visibility','none'); continue; }
      if (sl === 'building' && t === 'fill'){ setP(id,'fill-color',P.building); setP(id,'fill-outline-color',P.roadCase); continue; }
      if (sl === 'transportation' && t === 'line'){
        const cas = /casing|outline/.test(id);
        let c;
        if (/rail|transit/.test(id)) c = P.rail;
        else if (/path|pedestrian|track|footway|cycleway|steps/.test(id)) c = P.path;
        else if (/motorway/.test(id)) c = cas ? P.motorwayCase : P.motorway;
        else if (/trunk|primary/.test(id)) c = cas ? P.primaryCase : P.primary;
        else if (/secondary|tertiary/.test(id)) c = cas ? P.roadCase : P.road;
        else if (/aeroway|runway|taxiway/.test(id)) c = P.roadCase;
        else c = cas ? P.minorCase : P.minor;
        setP(id,'line-color',c); continue;
      }
      if (sl === 'aeroway' && t === 'fill'){ setP(id,'fill-color',P.land2); continue; }
      if (sl === 'boundary' && t === 'line'){
        const state = /^boundary_3|state|admin_sub/.test(id);
        setP(id,'line-color', state ? P.state : P.country);
        setP(id,'line-opacity', state ? .7 : .9);
        continue;
      }
      if (t === 'symbol'){
        const tf = map.getLayoutProperty(id,'text-field');
        if (tf && /name/.test(JSON.stringify(tf)) && !/housenumber/.test(sl)) map.setLayoutProperty(id,'text-field', NAME_DE);
        const minor = sl === 'poi' || sl === 'transportation_name' || /village|suburb|hamlet|neighbourhood/.test(id);
        const col = id === 'state' ? P.state : sl === 'water_name' || /water/.test(id) ? P.waterText : sl === 'transportation_name' ? P.roadText : sl === 'poi' ? P.poi : minor ? P.textMinor : P.text;
        setP(id,'text-color',col); setP(id,'text-halo-color',P.halo); setP(id,'text-halo-width',1.4);
        if (sl === 'poi') map.setLayerZoomRange(id, 15, 24);
        continue;

    } catch(e){ /* layer differs from expectations: leave it as the style draws it */ }
  }
  ensureArcLayer();
}

const markers = {};
let arcKey = '';
function makeMarker(el){ return new maplibregl.Marker({element: el, anchor: 'center'}); }
function ensureArcLayer(){

  map.addLayer({id:'arc-halo', type:'line', source:'arc', layout:{'line-cap':'round','line-join':'round'}, paint:{'line-color':'#ffffff','line-width':8,'line-opacity':.9}});
  map.addLayer({id:'arc-line', type:'line', source:'arc', layout:{'line-cap':'round','line-join':'round'}, paint:{'line-width':4.5,'line-gradient':['interpolate',['linear'],['line-progress'],0,C.chris||'#0A84FF',1,C.juana||'#FF375F']}});

function updateArc(){

function schedule(){

    el.hidden = false;

/* view helpers */
function camPadding(){

const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function fitPoints(lnglats, animate=true){
  if (!map) return;

  if (lnglats.length === 1) { map.easeTo(Object.assign({center: lnglats[0], zoom: 11}, opts)); return; }
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for (const p of lnglats){ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); }
  try { map.fitBounds([[x0,y0],[x1,y1]], Object.assign({maxZoom: 12}, opts)); }
  catch(e){ map.jumpTo({center:[(x0+x1)/2,(y0+y1)/2], zoom:4}); }
}

/* ---------- geo math ---------- */
const distKm = (a,b) => geoDistance([a.lng,a.lat],[b.lng,b.lat]) * 6371;

function fmtDur(h){
  if (h >= 24){ const tot = Math.round(h); const d = Math.floor(tot/24), r = tot%24; return `${d} ${d===1?'Tag':'Tage'}${r?` ${r} Std`:''}`; }
  const m = Math.max(5, Math.round(h*60/5)*5); const hh = Math.floor(m/60), mm = m%60; return hh ? `${hh} Std${mm?` ${mm} Min`:''}` : `${mm} Min`;
}

/* ---------- real routes (FOSSGIS OSRM servers, OpenStreetMap data) ---------- */
const ROUTE_MODES = {car:'routed-car', bike:'routed-bike', foot:'routed-foot'};
const APP_VERSION = '2026-10-07';
const fmtSpeed = v => String(v).replace('.', ',');
const R = {key:'', status:{}, data:{}};
try { const c = JSON.parse(lsGet('cj-routes') || 'null'); if (c && c.key) { R.key = c.key; R.data = c.data || {}; for (const m in R.data) R.status[m] = 'ok'; } } catch(e){}

async function fetchRoute(mode, a, b){
  const url = `https://routing.openstreetmap.de/${ROUTE_MODES[mode]}/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=false&alternatives=false&steps=false`;
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 25000);
  try {
    const r = await fetch(url, {signal: ctl.signal});
    const j = await r.json();
    if (j.code === 'Ok' && j.routes && j.routes[0]) return {km: j.routes[0].distance/1000, h: j.routes[0].duration/3600};
    if (j.code === 'NoRoute') return {none: true};
    throw new Error(j.code || 'route');
  } finally { clearTimeout(t); }
}
let routesBusy = false;
async function ensureRoutes(){
  if (routesBusy) return;
  routesBusy = true;
  try { await loadRoutes(); } finally { routesBusy = false; }
  const a = S.people.chris, b = S.people.juana;
  if (a && b && routeKey(a,b) !== R.key) queueRoutes();
}
async function loadRoutes(){
  const a = S.people.chris, b = S.people.juana;
  if (!a || !b) return;
  const key = routeKey(a,b);
  if (key !== R.key){ R.key = key; R.data = {}; R.status = {}; }
  for (const mode of Object.keys(ROUTE_MODES)){
    if (R.status[mode]) continue;
    R.status[mode] = 'loading'; render();
    try {
      const res = await fetchRoute(mode, a, b);
      if (R.key !== key) return; // positions changed meanwhile
      if (res.none) R.status[mode] = 'none'; else { R.data[mode] = res; R.status[mode] = 'ok'; }
    } catch(e){ if (R.key !== key) return; R.status[mode] = 'error'; }
    lsSet('cj-routes', JSON.stringify({key: R.key, data: R.data}));
    render();
  }
}
let routeTimer = 0;
function queueRoutes(){ clearTimeout(routeTimer); routeTimer = setTimeout(ensureRoutes, 400); }
function routeRow(mode, icon, title, airKm, speed){
  const st = R.status[mode], d = R.data[mode];
  let sub, val;
  if (st === 'ok'){
    const h = speed ? d.km / speed : d.h;
    sub = `${nf0.format(d.km)} km · ${speed ? 'Ø ' + fmtSpeed(speed) + ' km/h' : 'ohne Stau'}`;
    val = fmtDur(h);
  } else if (st === 'none'){
    sub = 'Keine Strecke über Land'; val = '–';
  } else if (st === 'error'){
    const est = airKm * (mode==='foot' ? 1.25 : 1.3), h = est / (speed || 85);
    sub = `ca. ${nf0.format(est)} km · geschätzt`; val = fmtDur(h);
  } else {
    sub = 'wird berechnet …'; val = '…';
  }
  return `<div class="row"><span class="ic">${icon}</span><span class="txt"><span class="t">${title}</span><span class="d">${sub}</span></span><span class="val">${val}</span></div>`;
}
function ago(ts){
  if (!ts) return '';
  const s = (Date.now()-ts)/1000;
  if (s < 60) return 'gerade eben';
  const rtf = new Intl.RelativeTimeFormat('de',{numeric:'auto'});
  if (s < 3600) return rtf.format(-Math.round(s/60),'minute');
  if (s < 86400) return rtf.format(-Math.round(s/3600),'hour');
  return rtf.format(-Math.round(s/86400),'day');
}

/* ---------- server (Supabase) ---------- */
async function rpc(fn, args){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method:'POST',
    headers: Object.assign({'Content-Type':'application/json', apikey:SUPABASE_ANON_KEY}, SUPABASE_ANON_KEY.startsWith('sb_') ? {} : {Authorization:'Bearer '+SUPABASE_ANON_KEY}),
    body: JSON.stringify(Object.assign({p_token: TOKEN}, args||{}))
  });
  const txt = await r.text(); let data = null; try { data = txt ? JSON.parse(txt) : null; } catch(e){}
  if (!r.ok){ const err = new Error((data && data.message) || ('HTTP '+r.status)); err.badcode = !!(data && /code/i.test(data.message||'')); throw err; }
  return data;
}
function cleanPerson(d){ if (!d || d.lat==null || d.lng==null) return null; const lat=+d.lat, lng=+d.lng; if (!isFinite(lat)||!isFinite(lng)) return null; return {lat, lng, place:String(d.place||''), cc:String(d.cc||'').slice(0,3), updatedAt:+d.updatedAt||0}; }

  const p = st.people || {};
  S.people = {chris: cleanPerson(p.chris), juana: cleanPerson(p.juana)};
  for (const w of ['chris','juana']) if (S.people[w] && !S.people[w].place){ const n = nearestCity(S.people[w].lng, S.people[w].lat); S.people[w].place = n.km < 8 ? n.city.n : 'bei ' + n.city.n; S.people[w].cc = n.city.cc; }
  for (const w of ['chris','juana']) if (S.people[w] && !S.people[w].cc){ S.people[w].cc = nearestCity(S.people[w].lng, S.people[w].lat).city.cc; }
  if (!S.editingPlan) S.plan = cleanPlan(st.plan);
  S.state = 'ok';
}
let fittedOnce = false, busy = false;
async function refresh(){
  if (!CONFIGURED){ S.state='noconfig'; render(); return; }

  render(); schedule(); if (announce){ fitBoth(true); expand(false); } else if (firstFix) fitBoth(true);
  try { applyState(await rpc('cj_update_location', {p_lat:String(lat), p_lng:String(lng), p_place:place, p_cc:near.city.cc})); render(); schedule(); if (announce) toast(`Standort gesetzt: ${place}`); }

  S.plan = {at, place, by:S.me||'', updatedAt:Date.now()}; S.editingPlan = false; render();
  try { applyState(await rpc('cj_set_plan', {p_at: new Date(at).toISOString(), p_place: place})); render(); toast('Wiedersehen gespeichert'); }
  catch(e){ toast('Speichern hat nicht geklappt. Prüf deine Verbindung.'); }
}
async function clearPlan(){
  S.plan = null; S.editingPlan = false; render();
  try { applyState(await rpc('cj_clear_plan')); render(); } catch(e){ toast('Löschen hat nicht geklappt.'); }
}
function setToken(code){
  const c = (code||'').trim().toLowerCase();
  if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(c)){ toast('Der Code sieht nicht richtig aus.'); return; }
  TOKEN = c; lsSet('cj-token', c); S.state='loading'; fittedOnce=false; render(); refresh().then(() => gpsUpdate(false));
}
function logout(){ TOKEN = null; lsSet('cj-token', null); S.me=null; S.state='nocode'; render(); }


/* ---------- picking on the map ---------- */
function pickPoint(){
  const top = (parseFloat(getComputedStyle(document.documentElement).paddingTop)||0) + 60;
  const bar = $('#pickbar').getBoundingClientRect();
  if (W >= 760) return [W/2, H/2];
  return [W/2, (top + (bar.top||H-140)) / 2];
}
function startPick(){
  if (S.state !== 'ok'){ toast('Erst mit deinem Code verbinden.'); expand(true); return; }
  S.picking = true; $('#sheet').classList.add('hide'); $('#pickbar').hidden=false; $('#cross').hidden=false;
  const mine = S.people[S.me];
  if (mine) fitPoints([[mine.lng, mine.lat]], true);
  else if (map && map.getZoom() < 4) fitPoints([[-5,36],[25,58]], true);
  readColors(); placeCross(); updatePickLabel();
}
function endPick(){ S.picking=false; $('#sheet').classList.remove('hide'); $('#pickbar').hidden=true; $('#cross').hidden=true; }
function pickedLngLat(){ if (!map) return null; const c = pickPoint(); const ll = map.unproject(c); return [((ll.lng+540)%360)-180, ll.lat]; }
function updatePickLabel(){
  const ll = pickedLngLat(); if (!ll) return;
  const {city, km} = nearestCity(ll[0], ll[1]);
  $('#pickplace').textContent = km < 8 ? `${city.n}, ${country(city.cc)}` : `bei ${city.n}, ${country(city.cc)} · ${fmtKm(km)} entfernt`;
}
$('#btn-pick').onclick = startPick;
$('#btn-gps').onclick = () => { if (S.state !== 'ok'){ toast('Erst mit deinem Code verbinden.'); expand(true); return; } gpsUpdate(true); };
$('#pick-cancel').onclick = endPick;
$('#pick-ok').onclick = () => { const ll = pickedLngLat(); endPick(); if (ll) setMyLocation(ll[0], ll[1]); };
$('#btn-fit').onclick = () => fitBoth(true);
document.querySelectorAll('.pin .bubble').forEach(b => b.onclick = () => { const p = S.people[b.dataset.who]; if (p) fitPoints([[p.lng,p.lat]], true); });

/* ---------- sheet ---------- */
const sheet = $('#sheet');
function peekPx(){ return S.state === 'ok' ? 228 : (S.state==='nocode'||S.state==='badcode' ? 330 : 290); }
function setPeek(){ document.documentElement.style.setProperty('--peek', peekPx() + 'px'); }
function expand(on){ S.full = on; sheet.classList.toggle('full', on); }
(function dragSheet(){
  const head = $('#sheethead'); let y0=null, start=0, moved=false, t0=0;
  head.addEventListener('pointerdown', e => { if (W>=760 || e.target.closest('input,.meava')) return; y0=e.clientY; t0=performance.now(); moved=false; sheet.classList.add('drag'); head.setPointerCapture(e.pointerId);
    const m = new DOMMatrixReadOnly(getComputedStyle(sheet).transform); start = m.m42; });
  head.addEventListener('pointermove', e => { if (y0===null) return; const dy = e.clientY-y0; if (Math.abs(dy)>4) moved=true;
    const max = sheet.offsetHeight - peekPx(); sheet.style.transform = `translateY(${Math.max(0, Math.min(max, start+dy))}px)`; });
  const up = e => { if (y0===null) return; sheet.classList.remove('drag'); sheet.style.transform='';
    const dy = e.clientY-y0, v = dy/Math.max(1, performance.now()-t0); y0=null;
    if (!moved){ expand(!S.full); return; }
    if (v < -0.4 || (dy < -60)) expand(true); else if (v > 0.4 || dy > 60) expand(false); else expand(S.full); };
  head.addEventListener('pointerup', up); head.addEventListener('pointercancel', up);
})();
$('#q').addEventListener('focus', () => expand(true));
$('#q').addEventListener('input', e => { S.query = e.target.value; render(); });
$('#meava').onclick = () => { if (S.state==='ok') gpsUpdate(true); else expand(true); };

/* ---------- render ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON = {
  car:'<svg viewBox="0 0 24 24"><path d="M5 11l1.6-4.3A2 2 0 0 1 8.5 5.4h7a2 2 0 0 1 1.9 1.3L19 11a2 2 0 0 1 1.5 1.9V17a1 1 0 0 1-1 1H19v1.2a.8.8 0 0 1-.8.8h-1.4a.8.8 0 0 1-.8-.8V18H8v1.2a.8.8 0 0 1-.8.8H5.8a.8.8 0 0 1-.8-.8V18h-.5a1 1 0 0 1-1-1v-4.1A2 2 0 0 1 5 11zm2.2 0h9.6l-1.2-3.3a.5.5 0 0 0-.5-.3H8.9a.5.5 0 0 0-.5.3zM7 15.5a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4zm10 0a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4z"/></svg>',
  train:'<svg viewBox="0 0 24 24"><path d="M12 2c4 0 7 .5 7 4v9.5a3.5 3.5 0 0 1-2.3 3.3l1.6 2.2h-2.3l-1.4-2H9.4L8 21H5.7l1.6-2.2A3.5 3.5 0 0 1 5 15.5V6c0-3.5 3-4 7-4zM7 7v4h10V7zm1.5 9.5a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6zm7 0a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6z"/></svg>',
  plane:'<svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>',
  heart:'<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.1 1.8-1.9 3.3-3.1 5.4-3.1 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>',
  bike:'<svg viewBox="0 0 24 24"><path d="M15.5 4.5a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6zM5.5 12a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 1.8a2.7 2.7 0 1 0 0 5.4 2.7 2.7 0 0 0 0-5.4zm13-1.8a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 1.8a2.7 2.7 0 1 0 0 5.4 2.7 2.7 0 0 0 0-5.4zM12.3 8.6l2.1 2.3h3.1v1.8h-3.9l-1.6-1.7-1.9 1.9 2.4 2V19h-1.8v-3.3l-3-2.5a1.2 1.2 0 0 1-.1-1.8l3.2-3.1a1.2 1.2 0 0 1 1.5.3z"/></svg>',
  roadbike:'<svg viewBox="0 0 24 24"><path d="M5.5 12a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 1.6a2.9 2.9 0 1 0 0 5.8 2.9 2.9 0 0 0 0-5.8zm13-1.6a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 1.6a2.9 2.9 0 1 0 0 5.8 2.9 2.9 0 0 0 0-5.8zM8 7h4v1.6H9.9l.9 2.4h5.4l-.9-2.6H14V6.8h2.4l2.9 8.6-1.5.5-1.1-3.3-4.6 4.1H11l-2.7-7.1H8zm4.5 5.6 2.1 1.9 1.1-1z"/></svg>',
  run:'<svg viewBox="0 0 24 24"><path d="M14.5 2.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM9.6 8.2l3.6-1c.8-.2 1.6.1 2 .8l1.6 2.7 2.9.6-.4 1.8-3.6-.8-.9-1.4-.9 3.4 2.6 2.4-.9 5.3-1.9-.3.7-4.2-2.9-2.4-1.1 3.6-4.6 1.6-.6-1.7 3.7-1.3 2-7.1-1.3.4-1.3 2.7-1.7-.8 1.6-3.4c.2-.4.6-.7 1-.8z"/></svg>',
  walk:'<svg viewBox="0 0 24 24"><path d="M13.5 2.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM10.2 8.3l2.6-.9c.9-.3 1.8.1 2.3.9l1.4 2.6 2.5 1-.7 1.7-3-1.2-.8-1.5-1 4 2.5 2.6V22h-1.9v-4.8l-2.2-2.2-.8 3.6L7 22l-1.6-1.1 3.9-4.5 1.6-6.4-1.6.6-1 3-1.8-.6 1.3-3.8c.2-.4.5-.7.9-.9z"/></svg>',
  pin:'<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7zm0 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>'
};
function countdownParts(at){
  let s = Math.max(0, Math.floor((at - Date.now())/1000));
  const d = Math.floor(s/86400); s%=86400; const h = Math.floor(s/3600); s%=3600; const m = Math.floor(s/60); return {d,h,m,s:s%60};
}
function planShort(){
  if (!S.plan) return {v:'–', s:'Noch kein Termin'};
  const diff = S.plan.at - Date.now();
  if (diff <= 0){
    const sameDay = new Date(S.plan.at).toDateString() === new Date().toDateString();
    return sameDay ? {v:'Heute', s:'Ihr seht euch heute'} : {v:'Vorbei', s:'Plant das nächste Treffen'};
  }
  const p = countdownParts(S.plan.at);
  const v = p.d >= 1 ? `${p.d} <small>${p.d===1?'Tag':'Tage'}</small>` : `${p.h} <small>Std</small> ${p.m} <small>Min</small>`;
  return {v, s: new Date(S.plan.at).toLocaleDateString('de-DE',{weekday:'short', day:'numeric', month:'short'}) + (S.plan.place ? ' · ' + S.plan.place : '')};
}
function toLocalInput(ms){ const d = new Date(ms); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }

function render(){
  setPeek();
  const meBtn = $('#meava');
  meBtn.textContent = S.me ? NAMES[S.me][0] : '?';
  meBtn.style.background = S.me ? `var(--${S.me})` : '';
  meBtn.setAttribute('aria-label', S.me ? `${NAMES[S.me]}: GPS-Standort senden` : 'Verbinden');
  const body = $('#body');
  const focusId = document.activeElement && document.activeElement.id;
  let h = '';

  if (S.query.trim()){
    const res = searchCities(S.query);
    const other = S.me && S.people[OTHER[S.me]];
    h += '<div class="group results" style="margin-top:4px">';
    h += `<button class="row" id="res-map"><span class="ic">${ICON.pin}</span><span class="txt"><span class="t">Auf der Karte wählen</span><span class="d">Nadel selbst setzen</span></span></button>`;
    res.forEach((c,i) => {
      const dd = other ? fmtKm(distKm(c, other)) + ' bis ' + NAMES[OTHER[S.me]] : '';
      h += `<button class="row" data-ci="${CITIES.indexOf(c)}"><span class="ic">${ICON.pin}</span><span class="txt"><span class="t">${esc(c.n)}</span><span class="d">${esc(country(c.cc))}</span></span><span class="val d">${dd}</span></button>`;
    });
    if (!res.length) h += `<div class="row"><span class="txt"><span class="t">Kein Ort gefunden</span><span class="d">Probier eine größere Stadt in der Nähe oder setz die Nadel auf der Karte.</span></span></div>`;
    h += '</div>';
    body.innerHTML = h;
    body.querySelectorAll('[data-ci]').forEach(b => b.onclick = () => { const c = CITIES[+b.dataset.ci]; setMyLocation(c.lng, c.lat, c); });
    $('#res-map').onclick = () => { S.query=''; $('#q').value=''; $('#q').blur(); render(); startPick(); };
    return;
  }

  if (S.state === 'noconfig'){
    h += `<div class="group who" id="whoblock"><p><b>Noch nicht eingerichtet.</b> Trag in der Datei <code>config.js</code> die Supabase-Adresse und den Key ein (README, Schritt 2).</p></div>`;
  } else if (S.state === 'nocode' || S.state === 'badcode'){
    h += `<div class="group who" id="whoblock"><p>${S.state==='badcode' ? 'Dieser Code passt nicht. ' : ''}Gib deinen persönlichen Code ein. Du findest ihn in der Ergebnistabelle aus dem Supabase-Skript.</p>
      <form id="codeform" class="form" style="padding:0"><label for="code-in">Dein Code<input id="code-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></label><button class="btn primary" type="submit">Verbinden</button></form></div>`;
  } else if (S.state === 'loading'){
    h += `<div class="group who" id="whoblock"><p>Verbinde …</p></div>`;
  } else if (S.state === 'offline'){
    h += `<div class="group who" id="whoblock"><p>Keine Verbindung zur Datenbank. Die Karte zeigt den letzten Stand und versucht es gleich wieder.</p></div>`;
  }

  const a=S.people.chris, b=S.people.juana, both = a && b;
  const ps = planShort();
  h += `<div class="summary">
    <div class="stat"><div class="k">Entfernung</div><div class="v">${both ? esc(fmtKm(distKm(a,b))).replace(' km',' <small>km</small>') : '–'}</div><div class="s">${both ? (R.key === routeKey(a,b) && R.data.car ? `Luftlinie · ${nf0.format(R.data.car.km)} km mit dem Auto` : 'Luftlinie zwischen euch') : 'Beide Standorte fehlen noch'}</div></div>
    <div class="stat when"><div class="k">Wiedersehen</div><div class="v" id="cdshort">${ps.v}</div><div class="s">${esc(ps.s)}</div></div>
  </div>`;

  // Wiedersehen
  h += '<h2>Wiedersehen</h2><div class="group">';
  if (S.editingPlan || !S.plan){
    const def = S.plan ? toLocalInput(S.plan.at) : toLocalInput(Date.now() + 7*86400000 - (Date.now()%3600000));
    h += `<form class="form" id="planform">
      <label for="plan-at">Wann seht ihr euch?<input id="plan-at" type="datetime-local" required value="${def}"></label>
      <label for="plan-place">Wo? (optional)<input id="plan-place" type="text" maxlength="80" placeholder="z. B. Bahnhof Magdeburg" value="${esc(S.plan ? S.plan.place : '')}"></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${S.plan ? '<button type="button" class="btn" id="plan-cancel">Abbrechen</button>' : ''}<button class="btn primary" type="submit">Wiedersehen speichern</button></div>
    </form>`;
  } else {
    const p = countdownParts(S.plan.at), when = new Date(S.plan.at);
    h += `<div class="count" aria-live="off"><div><b id="cd-d">${p.d}</b><span>Tage</span></div><div><b id="cd-h">${p.h}</b><span>Std</span></div><div><b id="cd-m">${p.m}</b><span>Min</span></div><div><b id="cd-s">${p.s}</b><span>Sek</span></div></div>
      <div class="plantitle">${esc(when.toLocaleDateString('de-DE',{weekday:'long', day:'numeric', month:'long', year:'numeric'}))}, ${esc(when.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}))} Uhr</div>
      <div class="plansub">${S.plan.place ? esc(S.plan.place) + ' · ' : ''}${S.plan.by ? 'eingetragen von ' + NAMES[S.plan.by] : ''}</div>
      <div class="btnrow"><button class="btn" id="plan-edit">Ändern</button><button class="btn danger" id="plan-del">Termin löschen</button></div>`;
  }
  h += '</div>';

  // Ihr zwei
  h += '<h2>Ihr zwei</h2><div class="group">';
  for (const w of ['chris','juana']){
    const p = S.people[w];
    h += `<div class="row"><span class="ava" style="background:var(--${w})">${NAMES[w][0]}</span><span class="txt"><span class="t">${NAMES[w]}${w===S.me?' (du)':''}</span><span class="d" data-ago="${p?p.updatedAt:''}">${p ? esc(p.place + ', ' + country(p.cc)) + ' · ' + ago(p.updatedAt) : 'Noch kein Standort'}</span></span></div>`;
  }
  if (S.me) h += `<div class="btnrow"><button class="btn primary" id="me-gps">GPS jetzt</button><button class="btn" id="me-search">Ort suchen</button><button class="btn" id="me-pick">Auf der Karte setzen</button></div>`;
  h += '</div>';

  if (both){
    const km = distKm(a,b);
    const train = km*1.35/95 + 0.5, fly = km/750 + 3;
    if (routeKey(a,b) !== R.key || Object.keys(ROUTE_MODES).some(m => !R.status[m])) queueRoutes();
    h += '<h2>Unterwegs</h2><div class="group">';
    h += routeRow('car', ICON.car, 'Auto', km);
    h += `<div class="row"><span class="ic">${ICON.train}</span><span class="txt"><span class="t">Bahn</span><span class="d">ca. ${nf0.format(km*1.35)} km · geschätzt</span></span><span class="val">${fmtDur(train)}</span></div>`;
    if (km > 350) h += `<div class="row"><span class="ic">${ICON.plane}</span><span class="txt"><span class="t">Flug</span><span class="d">geschätzt, mit Check-in</span></span><span class="val">${fmtDur(fly)}</span></div>`;
    h += routeRow('bike', ICON.roadbike, 'Rennrad', km, 30);
    h += routeRow('bike', ICON.bike, 'Fahrrad', km, 16);
    h += routeRow('foot', ICON.run, 'Laufen', km, 10);
    h += routeRow('foot', ICON.walk, 'Zu Fuß', km, 4.5);
    h += '</div><p class="note">Auto, Rad und zu Fuß: echte Strecken nach OpenStreetMap (Routendienst der FOSSGIS), Zeiten ohne Pausen. Rennrad und Fahrrad nutzen die Radstrecke, Laufen und zu Fuß den Fußweg. Bahn und Flug sind aus der Luftlinie geschätzt. Steht „geschätzt“ bei einer echten Strecke, war der Routendienst gerade nicht erreichbar.</p>';
    const m = geoInterpolate([a.lng,a.lat],[b.lng,b.lat])(0.5); const nc = nearestCity(m[0], m[1]);
    h += `<h2>Halbe Strecke</h2><div class="group"><div class="row"><span class="ic">${ICON.heart}</span><span class="txt"><span class="t">${esc(nc.city.n)}, ${esc(country(nc.city.cc))}</span><span class="d">Für jeden ca. ${fmtKm(km/2)}${nc.km>30?' · nächste größere Stadt zur Mitte':''}</span></span></div></div>`;
  }

  if (S.state === 'ok' || S.state === 'offline') h += `<div class="foot"><span class="status ${S.state==='ok'?'':'off'}"><i></i>${S.state==='ok' ? 'Verbunden als ' + NAMES[S.me] : 'Offline'}</span><button id="logout">Code wechseln</button></div><p class="note" style="text-align:center">Version ${APP_VERSION}</p>`;
  body.innerHTML = h;

  const cf = $('#codeform'); if (cf) cf.onsubmit = e => { e.preventDefault(); setToken($('#code-in').value); };
  const lo = $('#logout'); if (lo) lo.onclick = () => { if (lo.dataset.sure) logout(); else { lo.dataset.sure='1'; lo.textContent='Wirklich abmelden?'; } };
  const mg = $('#me-gps'); if (mg) mg.onclick = () => gpsUpdate(true);
  const pf = $('#planform');
  if (pf) pf.onsubmit = e => { e.preventDefault(); const v = $('#plan-at').value; const at = new Date(v).getTime(); if (!isFinite(at)) { toast('Bitte Datum und Uhrzeit wählen.'); return; } savePlan(at, $('#plan-place').value.trim()); };
  const pc = $('#plan-cancel'); if (pc) pc.onclick = () => { S.editingPlan=false; render(); };
  const pe = $('#plan-edit'); if (pe) pe.onclick = () => { S.editingPlan=true; render(); };
  const pd = $('#plan-del'); if (pd) pd.onclick = () => { if (pd.dataset.sure){ clearPlan(); } else { pd.dataset.sure='1'; pd.textContent='Wirklich löschen?'; } };
  const ms = $('#me-search'); if (ms) ms.onclick = () => $('#q').focus();
  const mp = $('#me-pick'); if (mp) mp.onclick = startPick;
  if (focusId && document.getElementById(focusId) && focusId!=='q') document.getElementById(focusId).focus();
}

/* tick */
setInterval(() => {
  if (!S.plan || S.editingPlan) return;
  const p = countdownParts(S.plan.at);
  const set = (id,v) => { const e=document.getElementById(id); if (e && e.textContent!==String(v)) e.textContent=v; };
  set('cd-d',p.d); set('cd-h',p.h); set('cd-m',p.m); set('cd-s',p.s);
  const cs = $('#cdshort'); const v = planShort().v; if (cs && cs.innerHTML !== v) cs.innerHTML = v;
}, 1000);
setInterval(() => { placeAgo(); if (!S.query && !S.editingPlan && !document.querySelector('#body input:focus')) render(); }, 30000);
function placeAgo(){
  for (const w of ['chris','juana']){ const p=S.people[w]; const t = document.querySelector('#pin-'+w+' .tag span'); if (t) t.textContent = p ? ago(p.updatedAt) : ''; }
}

/* toast */
let tt=0;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; t.style.opacity=1; clearTimeout(tt); tt=setTimeout(()=>{ t.style.opacity=0; setTimeout(()=>t.hidden=true,260); },2200); }

/* theme */
readColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { arcKey=''; onThemeChange(); });
new MutationObserver(() => { arcKey=''; onThemeChange(); }).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

const _render = render;
render = function(){ _render(); placeAgo(); };

window.addEventListener('resize', resize);
resize();
initMap();
render();
fitBoth(false);
refresh().then(() => gpsUpdate(false));
setInterval(() => { if (document.visibilityState === 'visible' && !S.picking) refresh(); }, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh().then(() => gpsUpdate(false)); });
})();
</script>
